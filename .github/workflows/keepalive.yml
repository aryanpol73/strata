name: Keep awake

# Render's free plan puts the app to sleep after 15 minutes without traffic, and waking it takes about a minute. A request
# every few minutes means nobody meets that wait. It runs on the default branch only, and is free for a public repository.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake the app
        env:
          # Set a repository variable called APP_URL to point this somewhere else.
          APP_URL: ${{ vars.APP_URL || 'https://strata-0k8v.onrender.com' }}
        run: curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 "$APP_URL/api/health"
