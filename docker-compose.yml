# `docker compose up -d mongo redis` gives you local infrastructure.
# `docker compose up --build` runs the whole stack from the production image.
services:
  mongo:
    image: mongo:8
    ports: ['27017:27017']
    volumes: ['mongo:/data/db']
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: ['redis:/data']
  api:
    build: .
    depends_on: [mongo, redis]
    env_file: .env
    environment:
      ROLE: api
      MONGODB_URI: mongodb://mongo:27017/strata
      REDIS_URL: redis://redis:6379
      WEB_DIST: /app/web
      MEDIA_DIR: /data/uploads
    volumes: ['uploads:/data/uploads']
    ports: ['4000:4000']
  worker:
    build: .
    depends_on: [mongo, redis]
    env_file: .env
    environment:
      ROLE: worker
      MONGODB_URI: mongodb://mongo:27017/strata
      REDIS_URL: redis://redis:6379
volumes:
  mongo:
  redis:
  uploads:
