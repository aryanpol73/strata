# Free staging on Render, using the native Node runtime. See docs/07-deployment.md for what the free plan costs in behaviour.
services:
  - type: web
    name: strata
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    # Dev dependencies are needed to build, and NODE_ENV=production would otherwise skip them.
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm --filter @strata/web build && corepack pnpm --filter @strata/server build
    startCommand: node apps/server/dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      # Only the tests use this MongoDB binary, and it's a large download.
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: '1'
      - key: ROLE
        value: all
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: WEB_DIST
        value: apps/web/dist
      - key: MEDIA_PROVIDER
        value: cloudinary
      - key: JWT_SECRET
        generateValue: true
      - key: MEDIA_SIGNING_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: strata-redis
          property: connectionString
      - key: MONGODB_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: keyvalue
    name: strata-redis
    plan: free
    region: singapore
    # BullMQ needs its keys kept, and Render's default policy would evict them.
    maxmemoryPolicy: noeviction
    ipAllowList: []
